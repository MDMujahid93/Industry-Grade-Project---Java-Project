apiVersion: apps/v1
kind: Deployment
metadata:
  name: abc-tech-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: abc-tech
  template:
    metadata:
      labels:
        app: abc-tech
    spec:
      containers:
      - name: abc-tech-container
        image: mujahid93/abc_tech:3
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: abc-tech-service
spec:
  type: LoadBalancer
  selector:
    app: abc-tech
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
