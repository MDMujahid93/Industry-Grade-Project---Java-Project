pipeline
{
	agent any
	stages
	{
		stage('Code Checkout')
		{
			steps
			{
				git 'https://github.com/MDMujahid93/Industry-Grade-Project---Java-Project'
			}
		}
		
		stage('Code Compile')
		{
			steps
			{
				sh 'mvn compile'
			}
		}

		stage('Test')
		{
			steps
			{
				sh 'mvn test'
			}
		}

		stage('Build')
		{
			steps
			{
				sh 'mvn package'
			}
		}


		stage('Build Docker Image')
		{
			steps
			{
			        sh 'cp /var/lib/jenkins/workspace/$JOB_NAME/target/ABCtechnologies-1.0.war abc_tech.war'
                                sh 'docker build -t abc_tech:$BUILD_NUMBER .'
				sh 'docker tag abc_tech:$BUILD_NUMBER MDMujahid93/abc_tech:$BUILD_NUMBER'
			}
		}

		stage('Push Docker Image')
		{ 
			steps
			{   
			    withDockerRegistry([ credentialsId: "MDMujahid93-dockerhub", url: "" ])
			    {
			       sh 'docker push MDMujahid93/abc_tech:$BUILD_NUMBER'
			    }
			}
		}

		stage('Deploy as container')
		{
			steps
			{
				sh 'docker run -itd -P MDMujahid93/abc_tech:$BUILD_NUMBER'
			}
		}


		stage('Deploy to k8s cluster ')
		{
			steps
			{
			       sh “sed -i ‘s/abc_tech:latest/abc_tech:$BUILD_NUMBER/g' abc_tech.yaml”
			        sh 'kubectl apply -f abc_tech.yaml'
			}
		}


   }
}
